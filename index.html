<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Reality</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2b2b2b;
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
        }
        .logo {
            max-width: 280px;
            width: 80%;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            color: #aaaaaa;
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            width: 250px;
            transition: 0.2s;
        }
        .btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        .google-play {
            background: #238636;
            color: white;
        }
        .google-play:hover {
            background: #2ea043;
        }
        .app-store {
            background: #0a84ff;
            color: white;
        }
        .app-store:hover {
            background: #3d9bff;
        }
        .rustore {
            background: #0077FF;
            color: white;
        }
        .rustore:hover {
            background: #339bff;
        }
        @media (max-width: 480px) {
            body {
                padding: 50px 15px;
            }
            .logo {
                max-width: 220px;
            }
            p {
                font-size: 1em;
            }
            .btn {
                width: 100%;
                max-width: 280px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Double Reality" class="logo">
    <p>Разработчик мобильных приложений</p>
    <div class="buttons">
        <a href="https://play.google.com/store/apps/developer?id=Double+Reality" class="btn google-play" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
            Google Play
        </a>
        <a href="https://apps.apple.com/ru/developer/andrey-abrosimov/id1439688555" class="btn app-store" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.47C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.13,6.91 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.09,16.67C20.06,16.74 19.67,18.11 18.71,19.5M13,3.5C13.73,2.67 14.94,2.04 15.94,2C16.07,3.17 15.6,4.35 14.9,5.19C14.21,6.04 13.07,6.7 11.95,6.61C11.8,5.46 12.36,4.26 13,3.5Z"/></svg>
            App Store
        </a>
        <a href="https://www.rustore.ru/catalog/developer/ip7suwef" class="btn rustore" target="_blank">
            <img src="rustore-icon.png" alt="RuStore" style="width:24px; height:24px; border-radius:6px;">
            RuStore
        </a>
    </div>
</body>
</html>
